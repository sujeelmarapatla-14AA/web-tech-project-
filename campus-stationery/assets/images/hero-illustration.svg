<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f1f5f9"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk surface -->
  <path d="M 40 330 Q 300 350 560 330 L 560 380 L 40 380 Z" fill="url(#deskGrad)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Backpack / Bag -->
  <g transform="translate(70, 160)">
    <path d="M20 170 C10 110, 40 40, 80 40 C120 40, 150 110, 140 170 Z" fill="#3b82f6"/>
    <path d="M50 40 C50 15, 110 15, 110 40" fill="none" stroke="#1d4ed8" stroke-width="8"/>
    <rect x="40" y="90" width="80" height="60" rx="8" fill="#1d4ed8"/>
    <rect x="65" y="105" width="30" height="8" rx="2" fill="#93c5fd"/>
    <!-- Pencil sticking out -->
    <g transform="translate(110, 20) rotate(15)">
      <rect x="0" y="0" width="10" height="50" rx="2" fill="#f59e0b"/>
      <polygon points="0,0 10,0 5,-12" fill="#212529"/>
    </g>
  </g>
  
  <!-- Stack of Notebooks -->
  <g transform="translate(230, 200)">
    <!-- Bottom book -->
    <rect x="0" y="70" width="160" height="26" rx="4" fill="#0284c7"/>
    <rect x="150" y="73" width="8" height="20" fill="#f8fafc"/>
    <line x1="10" y1="83" x2="140" y2="83" stroke="#38bdf8" stroke-width="2"/>
    <!-- Middle book -->
    <rect x="15" y="44" width="150" height="26" rx="4" fill="#8b5cf6"/>
    <rect x="155" y="47" width="8" height="20" fill="#f8fafc"/>
    <line x1="25" y1="57" x2="145" y2="57" stroke="#c084fc" stroke-width="2"/>
    <!-- Top book (Open or styled) -->
    <rect x="25" y="18" width="145" height="26" rx="4" fill="#10b981"/>
    <rect x="160" y="21" width="8" height="20" fill="#f8fafc"/>
    <!-- Pen lying on books -->
    <g transform="translate(45, 8) rotate(-5)">
      <rect x="0" y="0" width="100" height="8" rx="3" fill="#ef4444"/>
      <polygon points="100,0 100,8 112,4" fill="#1e293b"/>
      <rect x="5" y="0" width="15" height="8" rx="2" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Pen Stand with Pens & Rulers -->
  <g transform="translate(430, 180)">
    <!-- Stand Mug -->
    <rect x="20" y="60" width="60" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="50" y="112" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0d6efd" text-anchor="middle">MLRIT</text>
    <!-- Ruler inside -->
    <rect x="28" y="5" width="12" height="75" rx="2" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" transform="rotate(-8 28 5)"/>
    <!-- Pens & Pencils inside -->
    <g transform="translate(45, 10) rotate(12)">
      <rect x="0" y="0" width="8" height="70" rx="2" fill="#0d6efd"/>
      <rect x="0" y="0" width="8" height="15" rx="2" fill="#1e293b"/>
    </g>
    <g transform="translate(60, 20) rotate(22)">
      <rect x="0" y="0" width="8" height="65" rx="2" fill="#10b981"/>
    </g>
    <g transform="translate(38, 25) rotate(-18)">
      <rect x="0" y="0" width="7" height="60" rx="2" fill="#ec4899"/>
    </g>
  </g>

  <!-- Floating Badge: Fast Campus Pickup -->
  <g transform="translate(380, 50)">
    <rect x="0" y="0" width="180" height="50" rx="12" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))" stroke="#e2e8f0"/>
    <circle cx="28" cy="25" r="16" fill="#e0f2fe"/>
    <text x="28" y="30" font-size="16" text-anchor="middle">⚡</text>
    <text x="54" y="21" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">10-Min Counter Pickup</text>
    <text x="54" y="36" font-family="sans-serif" font-size="10" fill="#64748b">Direct from Campus Store</text>
  </g>

  <!-- Floating Badge: Student Discounts -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="170" height="50" rx="12" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))" stroke="#e2e8f0"/>
    <circle cx="28" cy="25" r="16" fill="#fef3c7"/>
    <text x="28" y="30" font-size="16" text-anchor="middle">🎓</text>
    <text x="54" y="21" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Subsidized Pricing</text>
    <text x="54" y="36" font-family="sans-serif" font-size="10" fill="#64748b">Up to 25% Off for Students</text>
  </g>
</svg>
