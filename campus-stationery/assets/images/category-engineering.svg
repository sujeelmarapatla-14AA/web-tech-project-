<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="100%" height="100%" fill="#faf5ff" rx="16"/>
  <circle cx="200" cy="150" r="110" fill="#f3e8ff"/>
  <!-- Scientific Calculator & Caliper/Gear -->
  <g transform="translate(140, 45)">
    <!-- Scientific Calculator -->
    <rect x="0" y="0" width="120" height="190" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    <!-- Screen -->
    <rect x="12" y="16" width="96" height="42" rx="4" fill="#94a3b8"/>
    <text x="20" y="36" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#0f172a">sin(45°) + √25</text>
    <text x="100" y="52" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">5.7071</text>
    <!-- Solar panel -->
    <rect x="74" y="20" width="30" height="10" rx="2" fill="#475569"/>
    <!-- Function Buttons -->
    <g fill="#475569">
      <rect x="14" y="68" width="18" height="10" rx="2"/>
      <rect x="36" y="68" width="18" height="10" rx="2"/>
      <rect x="58" y="68" width="18" height="10" rx="2"/>
      <rect x="80" y="68" width="18" height="10" rx="2"/>
      
      <rect x="14" y="84" width="18" height="10" rx="2"/>
      <rect x="36" y="84" width="18" height="10" rx="2"/>
      <rect x="58" y="84" width="18" height="10" rx="2"/>
      <rect x="80" y="84" width="18" height="10" rx="2"/>
    </g>
    <!-- Number keypad -->
    <g fill="#cbd5e1">
      <rect x="14" y="104" width="20" height="14" rx="2"/>
      <rect x="39" y="104" width="20" height="14" rx="2"/>
      <rect x="64" y="104" width="20" height="14" rx="2"/>
      <rect x="89" y="104" width="17" height="14" rx="2" fill="#ef4444"/>

      <rect x="14" y="124" width="20" height="14" rx="2"/>
      <rect x="39" y="124" width="20" height="14" rx="2"/>
      <rect x="64" y="124" width="20" height="14" rx="2"/>
      <rect x="89" y="124" width="17" height="14" rx="2" fill="#f59e0b"/>

      <rect x="14" y="144" width="20" height="14" rx="2"/>
      <rect x="39" y="144" width="20" height="14" rx="2"/>
      <rect x="64" y="144" width="20" height="14" rx="2"/>
      <rect x="89" y="144" width="17" height="34" rx="2" fill="#3b82f6"/>

      <rect x="14" y="164" width="45" height="14" rx="2"/>
      <rect x="64" y="164" width="20" height="14" rx="2"/>
    </g>
  </g>
  <text x="200" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle">Engineering Stationery</text>
</svg>
