<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="100%" height="100%" fill="#f0f7ff" rx="16"/>
  <defs>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd"/>
      <stop offset="100%" style="stop-color:#052c65"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc107"/>
      <stop offset="100%" style="stop-color:#fd7e14"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="200" cy="150" r="110" fill="#e0eeff"/>
  <!-- Pen 1: Fountain Pen -->
  <g transform="translate(140, 50) rotate(-25)">
    <rect x="0" y="20" width="22" height="150" rx="6" fill="url(#penGrad)" stroke="#ffffff" stroke-width="2"/>
    <path d="M0 20 L11 0 L22 20 Z" fill="url(#goldGrad)" stroke="#b27b00" stroke-width="1.5"/>
    <line x1="11" y1="0" x2="11" y2="15" stroke="#333" stroke-width="1.5"/>
    <circle cx="11" cy="15" r="2.5" fill="#333"/>
    <rect x="0" y="150" width="22" height="20" rx="3" fill="#212529"/>
    <rect x="4" y="60" width="14" height="60" rx="2" fill="#ffffff" opacity="0.3"/>
  </g>
  <!-- Pen 2: Highlighter -->
  <g transform="translate(230, 80) rotate(20)">
    <rect x="0" y="25" width="30" height="130" rx="5" fill="#20c997"/>
    <polygon points="5,25 25,25 20,0 10,0" fill="#d1e7dd"/>
    <polygon points="10,0 20,0 18,10 8,10" fill="#0f5132"/>
    <rect x="0" y="135" width="30" height="20" rx="3" fill="#0f5132"/>
  </g>
  <!-- Ink splashes / writing doodle -->
  <path d="M90 230 Q 150 200, 200 230 T 310 220" fill="none" stroke="#0d6efd" stroke-width="4" stroke-linecap="round"/>
  <circle cx="320" cy="218" r="4" fill="#0d6efd"/>
  <text x="200" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0d6efd" text-anchor="middle">Writing Materials</text>
</svg>
