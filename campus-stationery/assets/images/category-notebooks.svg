<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="100%" height="100%" fill="#f8f9fa" rx="16"/>
  <circle cx="200" cy="150" r="110" fill="#e9ecef"/>
  <!-- Spiral notebook -->
  <g transform="translate(130, 45)">
    <!-- Back cover shadow -->
    <rect x="8" y="10" width="145" height="185" rx="8" fill="#adb5bd" opacity="0.4"/>
    <!-- Notebook body -->
    <rect x="0" y="0" width="145" height="185" rx="8" fill="#0d6efd"/>
    <!-- Notebook label -->
    <rect x="25" y="45" width="95" height="50" rx="4" fill="#ffffff"/>
    <line x1="35" y1="62" x2="110" y2="62" stroke="#6c757d" stroke-width="2"/>
    <line x1="35" y1="75" x2="90" y2="75" stroke="#ced4da" stroke-width="2"/>
    <text x="72" y="85" font-family="sans-serif" font-size="8" font-weight="bold" fill="#0d6efd" text-anchor="middle">RECORD BOOK</text>
    <!-- Spiral wire binding -->
    <g fill="#495057">
      <circle cx="-2" cy="20" r="6" fill="#343a40"/>
      <circle cx="-2" cy="45" r="6" fill="#343a40"/>
      <circle cx="-2" cy="70" r="6" fill="#343a40"/>
      <circle cx="-2" cy="95" r="6" fill="#343a40"/>
      <circle cx="-2" cy="120" r="6" fill="#343a40"/>
      <circle cx="-2" cy="145" r="6" fill="#343a40"/>
      <circle cx="-2" cy="170" r="6" fill="#343a40"/>
      <rect x="-8" y="17" width="12" height="6" rx="3" fill="#ced4da"/>
      <rect x="-8" y="42" width="12" height="6" rx="3" fill="#ced4da"/>
      <rect x="-8" y="67" width="12" height="6" rx="3" fill="#ced4da"/>
      <rect x="-8" y="92" width="12" height="6" rx="3" fill="#ced4da"/>
      <rect x="-8" y="117" width="12" height="6" rx="3" fill="#ced4da"/>
      <rect x="-8" y="142" width="12" height="6" rx="3" fill="#ced4da"/>
      <rect x="-8" y="167" width="12" height="6" rx="3" fill="#ced4da"/>
    </g>
    <!-- Bookmark ribbon -->
    <path d="M100 0 v60 l10 -10 l10 10 v-60 Z" fill="#ffc107"/>
  </g>
  <text x="200" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0d6efd" text-anchor="middle">Notebooks &amp; Records</text>
</svg>
