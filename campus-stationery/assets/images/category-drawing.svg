<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="100%" height="100%" fill="#fffbf0" rx="16"/>
  <circle cx="200" cy="150" r="110" fill="#fef3d6"/>
  <!-- Mini Drafter / T-Square / Triangle -->
  <g transform="translate(100, 60)">
    <!-- Drawing Board angle -->
    <rect x="0" y="10" width="200" height="150" rx="4" fill="#deb887" stroke="#b08d57" stroke-width="3"/>
    <rect x="15" y="25" width="170" height="120" rx="2" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
    <!-- Set Square / Triangle -->
    <polygon points="40,135 120,135 40,55" fill="#60a5fa" opacity="0.75" stroke="#2563eb" stroke-width="2"/>
    <polygon points="50,125 100,125 50,75" fill="#ffffff" opacity="0.6"/>
    <!-- Compass -->
    <g transform="translate(130, 45) rotate(15)">
      <circle cx="15" cy="5" r="7" fill="#6c757d"/>
      <rect x="12" y="8" width="6" height="75" rx="2" fill="#adb5bd"/>
      <g transform="rotate(30, 15, 8)">
        <rect x="12" y="8" width="6" height="75" rx="2" fill="#adb5bd"/>
        <polygon points="12,83 18,83 15,95" fill="#212529"/>
      </g>
    </g>
  </g>
  <text x="200" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle">Drawing Supplies</text>
</svg>
