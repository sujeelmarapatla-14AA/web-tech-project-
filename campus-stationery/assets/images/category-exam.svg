<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="100%" height="100%" fill="#fff1f2" rx="16"/>
  <circle cx="200" cy="150" r="110" fill="#ffe4e6"/>
  <!-- Exam Pad / Clip Board & Hall Ticket pouch -->
  <g transform="translate(130, 45)">
    <!-- Clipboard body -->
    <rect x="0" y="0" width="140" height="185" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" opacity="0.9"/>
    <!-- Exam paper on board -->
    <rect x="12" y="25" width="116" height="150" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
    <!-- Clip on top -->
    <rect x="42" y="-10" width="56" height="24" rx="4" fill="#64748b"/>
    <rect x="52" y="-5" width="36" height="8" rx="2" fill="#94a3b8"/>
    <!-- Exam details mock lines -->
    <line x1="25" y1="45" x2="70" y2="45" stroke="#ef4444" stroke-width="3"/>
    <line x1="25" y1="60" x2="115" y2="60" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="25" y1="72" x2="115" y2="72" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="25" y1="84" x2="100" y2="84" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="25" y1="96" x2="115" y2="96" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="25" y1="108" x2="85" y2="108" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Pen lying on board -->
    <g transform="translate(95, 80) rotate(18)">
      <rect x="0" y="0" width="8" height="85" rx="3" fill="#0284c7"/>
      <polygon points="0,85 8,85 4,95" fill="#0f172a"/>
    </g>
    <!-- Stamp: APPROVED -->
    <g transform="translate(65, 125) rotate(-12)">
      <rect x="0" y="0" width="55" height="24" rx="3" fill="none" stroke="#22c55e" stroke-width="2"/>
      <text x="27.5" y="16" font-family="sans-serif" font-size="9" font-weight="900" fill="#22c55e" text-anchor="middle">VERIFIED</text>
    </g>
  </g>
  <text x="200" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#e11d48" text-anchor="middle">Exam Essentials</text>
</svg>
