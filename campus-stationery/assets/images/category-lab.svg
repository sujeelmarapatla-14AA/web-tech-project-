<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="100%" height="100%" fill="#f0fdf4" rx="16"/>
  <circle cx="200" cy="150" r="110" fill="#dcfce7"/>
  <!-- Lab Beaker and Flask -->
  <g transform="translate(130, 50)">
    <!-- Flask (Erlenmeyer) -->
    <path d="M50 40 L50 70 L20 145 C15 155, 25 165, 35 165 L105 165 C115 165, 125 155, 120 145 L90 70 L90 40 Z" fill="#ffffff" stroke="#059669" stroke-width="4"/>
    <rect x="44" y="32" width="52" height="10" rx="3" fill="#059669"/>
    <!-- Liquid in Flask -->
    <path d="M26 145 C24 150, 28 158, 35 158 L105 158 C112 158, 116 150, 114 145 L96 105 Q70 120, 44 105 Z" fill="#10b981" opacity="0.7"/>
    <!-- Bubbles -->
    <circle cx="70" cy="130" r="5" fill="#ffffff" opacity="0.8"/>
    <circle cx="85" cy="140" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="55" cy="145" r="4" fill="#ffffff" opacity="0.8"/>
    <!-- Safety Goggles -->
    <g transform="translate(70, 20) rotate(15)">
      <rect x="0" y="0" width="45" height="26" rx="10" fill="#0284c7" opacity="0.75" stroke="#0369a1" stroke-width="2"/>
      <rect x="52" y="0" width="45" height="26" rx="10" fill="#0284c7" opacity="0.75" stroke="#0369a1" stroke-width="2"/>
      <path d="M45 10 Q 48.5 6, 52 10" stroke="#0369a1" stroke-width="3" fill="none"/>
    </g>
  </g>
  <text x="200" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#059669" text-anchor="middle">Laboratory Supplies</text>
</svg>
